<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background back page -->
  <rect x="34" y="16" width="70" height="88" rx="14" fill="#60a5fa" opacity="0.6"/>
  <!-- Foreground front page -->
  <rect x="22" y="26" width="74" height="88" rx="16" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Header bar -->
  <rect x="32" y="38" width="54" height="8" rx="4" fill="#ffffff"/>
  <!-- Grid/Table lines -->
  <rect x="32" y="54" width="24" height="6" rx="3" fill="#93c5fd"/>
  <rect x="62" y="54" width="24" height="6" rx="3" fill="#bfdbfe"/>
  <rect x="32" y="68" width="24" height="6" rx="3" fill="#93c5fd"/>
  <rect x="62" y="68" width="24" height="6" rx="3" fill="#bfdbfe"/>
  <rect x="32" y="82" width="24" height="6" rx="3" fill="#93c5fd"/>
  <rect x="62" y="82" width="24" height="6" rx="3" fill="#bfdbfe"/>
</svg>